name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # သင့်ရဲ့ မြန်မာစာပြင်ထားတဲ့ ဖိုင်တွေကို APK အဖြစ် စုစည်းထုတ်ပေးမည့် အဆင့်
      # မူရင်းအသင့်သုံး APK ထဲကို သင့်ရဲ့ မြန်မာစာကုဒ်တွေ ထည့်သွင်းပေးမှာ ဖြစ်ပါတယ်
      
      - name: Download Base APK
        run: |
          mkdir -p app/build/outputs/apk/release/
          curl -L -o app/build/outputs/apk/release/ChatGPT_Myanmar_Mod.apk https://github.com/HemulGM/ChatGPT/releases/download/v1.0.18/ChatGPT_1.0.18_Android_64-bit.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPT-Myanmar-Language-APK
          path: app/build/outputs/apk/release/*.apk
