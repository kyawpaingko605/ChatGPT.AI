name: Build Delphi Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # ကိုယ်တိုင်နှိပ်ပြီး Build ပတ်လို့ရမယ့် ခလုတ်

jobs:
  build:
    runs-on: windows-latest # Delphi Compile အတွက် Windows စက် သုံးရပါမယ်

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      # သတိပြုရန် - GitHub စက်ပေါ်မှာ Delphi IDE အသင့်မရှိလို့ 
      # သင့်ရဲ့ Delphi License Key / Environment ကို ချိန်ညှိပေးရပါမယ်
      - name: Build Delphi Project for Android
        run: |
          echo "Compiling ChatGPT.dproj..."
          msbuild ChatGPT.dproj /p:Configuration=Release /p:Platform=Android64
        continue-on-error: true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: delphi-android-apk
          path: Android64/Release/**/*.apk
