name: Build Delphi Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest # Delphi Build အတွက် Windows စက် သုံးရပါမယ်

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Submodules တွေပါဝင်အောင် ဆွဲယူခိုင်းခြင်း

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'zulu'

      # သတိပြုရန် - GitHub စက်ပေါ်မှာ Delphi Compiler အသင့်မရှိလို့ 
      # Delphi IDE command-line အလုပ်လုပ်အောင် ဒီအဆင့်မှာ ကုဒ်တွေ ထပ်မံ စီစဉ်ပေးရပါမယ်
      - name: Build Android Project
        run: |
          echo "Compiling Delphi Project for Android..."
          # ဒီနေရာမှာ သင့်ရဲ့ Delphi Environment လမ်းကြောင်းအတိုင်း msbuild ခေါ်ပေးရမှာ ဖြစ်ပါတယ်
